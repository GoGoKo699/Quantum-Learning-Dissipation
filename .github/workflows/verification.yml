name: Scientific verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r verification/requirements.txt
      - run: python verification/check_science.py --simulate --output evidence/science.json
      - name: Preserve exact tested revision and sources
        run: |
          git rev-parse HEAD > evidence/commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/tree.txt
          git archive --format=tar HEAD | gzip > evidence/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned read-only browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-deps" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/browser-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify source-bound hosted mathematics at both widths
        env:
          NODE_PATH: ${{ runner.temp }}/browser-deps/node_modules
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          node --check verification/rendering/capture_hosted_math.cjs
          python3 -m py_compile verification/rendering/check_rendered_math.py
          node verification/rendering/capture_hosted_math.cjs \
            --root . --repository "$SOURCE_REPOSITORY" \
            --revision "$(git rev-parse HEAD)" --output hosted-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: hosted-evidence/
          if-no-files-found: warn
